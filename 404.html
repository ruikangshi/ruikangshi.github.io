<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Ruikang (Bobby) Shi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f7; --ink: #1a1917; --muted: #6b6860;
      --accent: #c8602a; --border: #e2e0db;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }
    body {
      background: var(--ink); color: var(--bg);
      font-family: var(--sans); font-weight: 300;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; position: relative;
    }

    /* Blueprint grid background */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,96,42,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,96,42,0.04) 1px, transparent 1px),
        linear-gradient(rgba(200,96,42,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,96,42,0.08) 1px, transparent 1px);
      background-size: 13px 13px, 13px 13px, 52px 52px, 52px 52px;
      pointer-events: none;
    }

    /* Corner marks */
    .corner { position: fixed; width: 28px; height: 28px; border-color: rgba(200,96,42,0.35); border-style: solid; }
    .tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    .tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    .bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    .br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

    .content {
      text-align: center; position: relative; z-index: 1;
      padding: 2rem;
      opacity: 0; animation: fadeUp .8s .2s forwards;
    }

    .error-code {
      font-family: 'Courier New', monospace;
      font-size: clamp(5rem, 18vw, 11rem);
      color: var(--accent); line-height: 1;
      letter-spacing: -.04em; opacity: .15;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; white-space: nowrap;
      z-index: 0;
    }

    .tag {
      font-family: 'Courier New', monospace;
      font-size: .7rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1; letter-spacing: -.02em;
      color: var(--bg); margin-bottom: 1rem;
    }
    h1 em { font-style: italic; color: var(--accent); }
    p {
      font-size: 1rem; color: rgba(250,249,247,.55);
      max-width: 380px; margin: 0 auto 2.5rem; line-height: 1.7;
    }

    /* Diagnostic readout */
    .diagnostic {
      font-family: 'Courier New', monospace;
      font-size: .65rem; letter-spacing: .12em;
      color: rgba(200,96,42,.45); margin-bottom: 2.5rem;
      line-height: 2;
    }
    .diagnostic span { display: block; }
    .diagnostic .ok { color: rgba(200,96,42,.7); }

    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: .75rem 1.75rem;
      font-size: .82rem; font-weight: 500; letter-spacing: .07em;
      text-transform: uppercase; text-decoration: none;
      border-radius: 2px; transition: all .2s; cursor: pointer;
      font-family: var(--sans);
    }
    .btn-primary { background: var(--accent); color: var(--bg); border: 1px solid var(--accent); }
    .btn-primary:hover { background: transparent; color: var(--accent); }
    .btn-ghost { background: transparent; color: rgba(250,249,247,.6); border: 1px solid rgba(250,249,247,.15); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* Tachometer SVG */
    .tacho-404 {
      position: fixed; bottom: -20px; right: 2rem;
      width: 200px; opacity: .06; pointer-events: none;
    }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes needle-sweep { 0%{transform:rotate(-80deg)} 100%{transform:rotate(80deg)} }

    .needle-anim {
      transform-origin: 100px 180px;
      animation: needle-sweep 2.5s 0.5s ease-in-out infinite alternate;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="error-code">404</div>

  <div class="content">
    <p class="tag">// Error Code 404</p>
    <h1>Wrong<br><em>Turn</em></h1>
    <p>Looks like this road doesn't exist. The page you're looking for may have moved or never existed.</p>

    <div class="diagnostic">
      <span>INITIALIZING DIAGNOSTIC...</span>
      <span class="ok">✓ ENGINE — OK</span>
      <span class="ok">✓ CHASSIS — OK</span>
      <span style="color:#e8803a;">✗ ROUTE — NOT FOUND</span>
      <span>SUGGEST: RETURN TO BASE</span>
    </div>

    <div class="btns">
      <a href="index.html" class="btn btn-primary">← Return Home</a>
      <a href="contact.html" class="btn btn-ghost">Contact Me</a>
    </div>
  </div>

  <!-- Tachometer -->
  <svg class="tacho-404" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M 20 180 A 120 120 0 0 1 180 180" fill="none" stroke="#c8602a" stroke-width="1.5"/>
    <line x1="20" y1="180" x2="28" y2="163" stroke="#c8602a" stroke-width="1"/>
    <line x1="40" y1="120" x2="50" y2="107" stroke="#c8602a" stroke-width="1"/>
    <line x1="72" y1="72"  x2="83" y2="62"  stroke="#c8602a" stroke-width="1"/>
    <line x1="120" y1="40" x2="130" y2="30" stroke="#c8602a" stroke-width="1"/>
    <line x1="165" y1="48" x2="173" y2="36" stroke="#c8602a" stroke-width="1"/>
    <line x1="180" y1="180" x2="166" y2="172" stroke="#c8602a" stroke-width="1"/>
    <path d="M 160 55 A 120 120 0 0 1 180 180" fill="none" stroke="#c8602a" stroke-width="3" opacity="0.6"/>
    <line class="needle-anim" x1="100" y1="180" x2="48" y2="80" stroke="#c8602a" stroke-width="1.5" stroke-dasharray="2,4"/>
    <circle cx="100" cy="180" r="5" fill="#c8602a"/>
    <text x="100" y="155" text-anchor="middle" font-family="Courier New" font-size="8" fill="#c8602a" letter-spacing="2">RPM × 1000</text>
  </svg>

  <!-- Title block -->
  <div style="position:fixed;bottom:20px;right:20px;font-family:'Courier New',monospace;font-size:.52rem;letter-spacing:.12em;color:rgba(200,96,42,.3);text-align:right;line-height:1.7;border-top:1px solid rgba(200,96,42,.15);padding-top:.3rem;">
    <span style="display:block;color:rgba(200,96,42,.5);">R. SHI — PORTFOLIO</span>
    <span style="display:block;">ERROR PAGE · REV.01</span>
  </div>

</body>
</html>
